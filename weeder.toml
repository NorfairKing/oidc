unused-types = true
type-class-roots = false
roots = [
  "^Main.main$",
  "^Paths_.*",
]
root-instances = [
  # A library may be put in a Set or used as a Map key by whoever depends on
  # it, which is a use weeder cannot see from this repo alone. Ord on Issuer
  # is used here, by the federation's Map; these two are the same promise to a
  # caller, and taking one back later would be a breaking change.
  { instance = "Ord TokenAudience" },
  { instance = "Ord Algorithm" },
]
