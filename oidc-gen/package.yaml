name: oidc-gen
version: 0.0.0
synopsis: Generators and tests for oidc
category: Web
author: Tom Sydney Kerckhove
maintainer: syd@cs-syd.eu
license: MIT

dependencies:
- base

library:
  source-dirs: src/
  ghc-options: -Wall
  dependencies:
  - QuickCheck
  - genvalidity
  - genvalidity-text
  - genvalidity-time
  - jose
  - lens
  - oidc
  - sydtest
  - text
  - time

tests:
  oidc-test:
    main: Spec.hs
    source-dirs: test/
    build-tools: sydtest-discover
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -Wall
    dependencies:
    - aeson
    - bytestring
    - containers
    - genvalidity-sydtest
    - jose
    - lens
    - oidc
    - oidc-gen
    - sydtest
    - time
